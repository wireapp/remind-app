# Datasource config
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL}
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.hibernate-orm.log.sql=false
# Draw one id per insert. Quarkus otherwise defaults to the "pooled-lo" optimizer, which reserves
# a block of ids per sequence call, while our sequences increment by 1. Every restart then drew a
# block overlapping ids the previous run had already used, and inserts failed on a duplicate
# primary key. Keep this in step with the sequences in db/migration.
quarkus.hibernate-orm.mapping.id.optimizer.default=none

# Run Flyway migrations automatically
quarkus.flyway.migrate-at-start=true

# Quartz config to schedule programmatic jobs
quarkus.scheduler.start-mode=forced
quarkus.quartz.store-type=jdbc-cmt

# LOGGING
# Log shape is kept in line with our Ktor-based apps so the Grafana dashboards and log parsers
# work the same way against every app. Every line, from either half of this app, carries exactly:
# timestamp, level, thread, logger, message - plus exception when a throwable is logged.
#
# This app has two logging backends. Its own code logs through slf4j -> logback and is shaped by
# logback.xml; the framework (Quarkus, Hibernate, Flyway, Agroal) logs through JBoss LogManager,
# which logback.xml cannot reach. The settings below shape that second half, so keep the two in
# step - changing one alone splits the stream into two shapes again.
#
# mdc is excluded rather than renamed to the "context" field the Ktor apps emit: JBoss LogManager
# serialises it as an object while logback's %mdc is a string, and one key arriving with two types
# breaks the index mapping. logback.xml drops "context" too, so neither half emits it - see the
# longer note there before reintroducing it.
quarkus.log.console.json.enabled=true
quarkus.log.console.json.zone-id=UTC
quarkus.log.console.json.exception-output-type=formatted
quarkus.log.console.json.key-overrides=logger-name=logger,thread-name=thread,stack-trace=exception
quarkus.log.console.json.excluded-keys=sequence,loggerClassName,threadId,mdc,ndc,hostName,processName,processId

#METRICS
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.binder.uptime=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
